version: "3.8"

services:
  # ── RAG Assistant Streamlit App ─────────────────────────────────────────────
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-assistant
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4jpassword}
      - USE_GRAPH_RAG=true
    volumes:
      - ./data/chroma_db:/app/data/chroma_db
      - ./data/logs:/app/data/logs
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # ── Neo4j Graph Database for GraphRAG ───────────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: rag-neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4jpassword}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-neo4jpassword} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  neo4j_data:
