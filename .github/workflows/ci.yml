name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Code Quality & Formatting ──────────────────────────────────────────
  lint:
    name: Code Quality & Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  # ── 2. Security & Secret Audit ───────────────────────────────────────────
  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Audit
        run: |
          bandit -r core/ graph/ ingestion/ evaluation/ providers/ -ll -q

      - name: Secret Placeholder Hygiene Check
        run: |
          # Ensure no real or test keys like 'sk-' or hardcoded credentials exist
          if grep -rnw . -e "sk-[a-zA-Z0-9]\{20,\}" --exclude-dir={.git,.venv,venv}; then
            echo "❌ Potential API Key detected!"
            exit 1
          fi
          echo "✅ Secret hygiene verification passed."

  # ── 3. Multi-Python Test Matrix ───────────────────────────────────────────
  test:
    name: Test Matrix (Python ${{ matrix.python-version }})
    needs: [lint, security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Test Suite with Coverage
        run: |
          pytest --cov=core --cov=graph --cov=ingestion --cov=evaluation --cov=providers \
                 --cov-report=xml --cov-report=term-missing \
                 tests/

      - name: Upload Coverage Artifact (Python 3.11)
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── 4. CI Status Gate ─────────────────────────────────────────────────────
  ci-status-gate:
    name: CI Pipeline Status Gate
    needs: [lint, security, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Matrix & Job Statuses
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ Lint job failed"
            exit 1
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "❌ Security job failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Test matrix job failed"
            exit 1
          fi
          echo "🎉 All CI checks passed successfully!"
