name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run pytest --cov=rag_assistant --cov-report=term-missing --cov-fail-under=85
      - run: uv run python -m build
      - name: Install and exercise the wheel outside the source tree
        run: |
          uv venv "$RUNNER_TEMP/installed" --python ${{ matrix.python }}
          uv pip install --python "$RUNNER_TEMP/installed/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/rag-assistant" evaluate
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-assistant:test .
      - name: Verify container startup and query lifecycle
        run: |
          docker run -d --name rag-test -p 127.0.0.1:8000:8000 rag-assistant:test
          python - <<'PYTEST'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2) as response:
                      assert json.load(response)['status'] == 'ok'
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Container did not start')
          request = urllib.request.Request('http://127.0.0.1:8000/api/demo', data=b'{}', headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request) as response:
              assert len(json.load(response)) == 4
          question = json.dumps({'text': 'How does Atlas handle Redis?'}).encode()
          request = urllib.request.Request('http://127.0.0.1:8000/api/ask', data=question, headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request) as response:
              assert json.load(response)['status'] == 'supported'
          PYTEST
      - if: always()
        run: docker logs rag-test
