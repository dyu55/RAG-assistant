name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Container Build & Smoke Test ──────────────────────────────────────────
  docker-smoke-test:
    name: Docker Build & Smoke Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: rag-assistant:test
          load: true

      - name: Test Container Startup & Health
        run: |
          docker run -d --name test-app -p 8501:8501 rag-assistant:test
          echo "Waiting for Streamlit server to boot..."
          for i in {1..15}; do
            if curl -s http://localhost:8501/_stcore/health | grep -q "ok"; then
              echo "✅ Streamlit container health check passed!"
              docker stop test-app && docker rm test-app
              exit 0
            fi
            sleep 2
          done
          echo "❌ Streamlit container health check timed out"
          docker logs test-app
          docker stop test-app && docker rm test-app
          exit 1
